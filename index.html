#msg{color:#9f9;font-size:34px}

#fdb{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-left:6px;font-size:22px;letter-spacing:1px;pointer-events:none}
#dm{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:3}

 if(b>100){x.strokeStyle=b==103?'#aaa':b==102?'#8d8d8d':'#b08a4a';x.lineWidth=b==103?6:5;x.beginPath();if(b==103){x.moveTo(8,8);x.lineTo(22,22)}else{x.moveTo(9,8);x.quadraticCurveTo(26,4,27,20)}x.stroke()}
 if(b==104){x.fillStyle='#e58a8a';x.beginPath();x.ellipse(16,16,11,8,-.5,0,6.3);x.fill();x.fillStyle='#fff';x.fillRect(11,14,4,4);return c.toDataURL()}
 if(b==106){x.fillStyle='#d33';x.beginPath();x.arc(16,18,9,0,6.3);x.fill();x.fillStyle='#4a8';x.fillRect(15,5,3,6);return c.toDataURL()}
 return c.toDataURL()}
function refresh(){hb.innerHTML=inv.slice(0,9).map((s,i)=>`<div class="s${i==sel?' on':''}">${s?`<img src="${ic(s.id)}"><b>${s.count}</b>`:''}</div>`).join('')}
function add(id){const s=inv.find(s=>s&&s.id==id&&s.count<64);if(s)s.count++;else{const i=inv.indexOf(null);if(i<0)return;inv[i]={id,count:1}}refresh()}
const P=[0,0,0],V=[0,0,0],k={};let yaw=0,pitch=0,locked=false,onG=false,Lm=0,Rm=0,cd=0,tg=null,prog=0;
let food=20,exh=0,starve=0,hp=20,regen=0,hurtCd=0,atk=0,MOBS=[],tod=.04,lum=1,day=1,dayN=1,spT=0;
const SERVER='https://voxel-plains-server--brodiemcneill.replit.app';
let clientID='player-'+Math.random().toString(36).slice(2,9),ED=[],lastSync=0;
async function syncToServer(){
 if(!ED.length)return;
 try{await fetch(SERVER+'/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({clientID,mutations:ED.map(e=>{const v=e.split(',');return{name:'setBlock',args:v.map(Number)}})})});
  ED=[];lastSync=performance.now()}catch(e){console.error('sync failed',e)}}
async function pullFromServer(){
 try{const res=await fetch(SERVER+'/api/pull'),data=await res.json();if(data.blocks)
  Object.entries(data.blocks).forEach(([k,b])=>{const v=k.split(',').map(Number);if(v.length==3&&v.every(Number.isFinite)&&v[1]>=0&&v[1]<H)set(v[0],v[1],v[2],b)})}
 catch(e){}}
function recBlock(x,y,z,b){ED.push(`${x},${y},${z},${b}`)}
const hit=()=>{const e=1e-4;for(let y=Math.floor(P[1]+e);y<=Math.floor(P[1]+1.8-e);y++)for(let x=Math.floor(P[0]-.3+e);x<=Math.floor(P[0]+.3-e);x++)for(let z=Math.floor(P[2]-.3+e);z<=Math.floor(P[2]+.3-e);z++){const b=get(x,y,z);if(b&&b!=7)return 1}return 0};
function ray(){
 const o=[P[0],P[1]+1.62,P[2]],d=[-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
 const c=o.map(Math.floor),st=d.map(Math.sign),dl=d.map(v=>v?Math.abs(1/v):1e9),tm=d.map((v,i)=>v?(v>0?c[i]+1-o[i]:o[i]-c[i])*dl[i]:1e9);
 let n=[0,0,0],t=0;
 while(t<=5){
  const b=get(c[0],c[1],c[2]);if(b&&b!=7)return{x:c[0],y:c[1],z:c[2],n,b};
  const i=tm[0]<tm[1]?(tm[0]<tm[2]?0:2):(tm[1]<tm[2]?1:2);
  c[i]+=st[i];t=tm[i];tm[i]+=dl[i];n=[0,0,0];n[i]=-st[i]}
 return null}
function place(t){
 const s=inv[sel];if(!t||!s)return;const x=t.x+t.n[0],y=t.y+t.n[1],z=t.z+t.n[2];
 if(y<0||y>=H||x<0||z<0||x>=W||z>=D)return;const b=get(x,y,z);if(b&&b!=7)return;
 if(P[0]-.3<x+1&&P[0]+.3>x&&P[1]<y+1&&P[1]+1.8>y&&P[2]-.3<z+1&&P[2]+.3>z)return;
 set(x,y,z,s.id);recBlock(x,y,z,s.id);if(!--s.count)inv[sel]=null;refresh()}
function feed(dt,run){const sp=Math.hypot(V[0],V[2]);exh+=sp*dt*(run?.1:.012)+(Lm?dt*.05:0);
 while(exh>=4){exh-=4;if(food>0){food--;hud()}}
 if(food<=0){if((starve+=dt)>4){starve=0;if(hp>1)hurt(1)}}else starve=0}
function hud(){const f=Math.ceil(food/2);fdb.innerHTML=`<span>${"🍗".repeat(f)}</span><span style="filter:grayscale(1) opacity(.35)">${"🍗".repeat(10-f)}</span>`;const n=Math.ceil(hp/2);hpb.innerHTML=`<span style="color:#e22">${'♥'.repeat(n)}</span><span style="color:#444">${'♥'.repeat(10-n)}</span>`}
function hurt(n){hp-=n;dm.style.opacity=.55;hud();if(hp<=0)die()}
function die(){hp=20;food=20;exh=0;P[0]=96.5;P[1]=20;P[2]=93.5;V.fill(0);hud()}
function step(dt){
 const mz=(k.KeyW?1:0)-(k.KeyS?1:0),mx=(k.KeyD?1:0)-(k.KeyA?1:0),l=Math.hypot(mx,mz)||1,run=(k.ShiftLeft||k.ControlLeft)&&mz>0&&food>6;
 const sp=(run?5.6:4.3),s=Math.sin(yaw),c=Math.cos(yaw),a=1-Math.exp(-dt*(onG?18:3.5));
 V[0]+=((-s*mz+c*mx)/l*sp-V[0])*a;V[2]+=((-c*mz-s*mx)/l*sp-V[2])*a;
 V[1]=Math.max(V[1]-32*dt,-50);if(k.Space&&onG){V[1]=9;exh+=run?.2:.05}
 const n=Math.ceil(dt/.008),h=dt/n;onG=false;
 for(let i=0;i<n;i++)for(let j=0;j<3;j++){const o=P[j];P[j]+=V[j]*h;if(hit()){P[j]=o;if(j==1&&V[1]<0)onG=true;V[j]=0}}
 P[0]=Math.min(W-.35,Math.max(.35,P[0]));P[2]=Math.min(D-.35,Math.max(.35,P[2]));
 cam.fov+=((run?80:72)-cam.fov)*Math.min(1,dt*10);cam.updateProjectionMatrix();
 const t=ray();hl.visible=!!t;if(t)hl.position.set(t.x+.5,t.y+.5,t.z+.5);
 if(Lm&&t&&t.y>0){
  if(!tg||tg.x!=t.x||tg.y!=t.y||tg.z!=t.z){tg=t;prog=0}
  prog+=dt/HARD[t.b];
  if(prog>=1){set(t.x,t.y,t.z,0);recBlock(t.x,t.y,t.z,0);add(DROP[t.b]||t.b);if(t.b==5&&rnd()<.1)add(106);tg=null;prog=0}
 }else{tg=null;prog=0}
 cr.visible=prog>0;
 if(prog>0){cr.position.copy(hl.position);const q=Math.min(9,prog*10|0);if(q!=cs)crack(q)}
 if(Rm&&(cd-=dt)<=0){cd=.2;place(t)}
}
addEventListener('keydown',e=>{k[e.code]=1;if(/^Digit[1-9]$/.test(e.code)){sel=+e.code[5]-1;refresh()}if(e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>k[e.code]=0);
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.55,Math.min(1.55,pitch-e.movementY*.0022))});
addEventListener('mousedown',e=>{if(!locked)return;if(e.button==0)Lm=1;if(e.button==2){Rm=1;cd=0}});
addEventListener('mouseup',e=>{if(e.button==0)Lm=0;if(e.button==2)Rm=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(locked){sel=(sel+(e.deltaY>0?1:8))%9;refresh()}},{passive:true});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement==cv;ov.style.display=locked?'none':'flex';if(!locked){Lm=Rm=0;for(const c in k)k[c]=0}});
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(locked){step(dt);feed(dt,(k.ShiftLeft||k.ControlLeft)&&(k.KeyW?1:0)>0);tod+=dt/300;if(tod>=1){tod-=1;dayN++}
  const s=Math.sin(tod*6.2832);day=Math.max(0,Math.min(1,s*3+.4));lum=.3+.7*day;
  const c=[10,14,36],dc=[158,201,255],sk=[236,128,80],dk=Math.max(0,1-Math.abs(s)*4)*.55,col=c.map((v,i)=>(v+(dc[i]-v)*day)*(1-dk)+sk[i]*dk);
  scene.background.setRGB(col[0]/255,col[1]/255,col[2]/255);scene.fog.color.copy(scene.background);
  MO.color.setScalar(lum);MW.color.setScalar(lum);
  const h=(tod*24+6)%24;clk.textContent=`Day ${dayN}  ${String(h|0).padStart(2,'0')}:${String((h%1)*60|0).padStart(2,'0')}`;
  if(performance.now()-lastSync>500)syncToServer()}
 dirty.forEach(i=>build(i%NX,i/NX|0));dirty.clear();
 cam.rotation.set(pitch,yaw,0,'YXZ');cam.position.set(P[0],P[1]+1.62,P[2]);R.render(scene,cam);
 dm.style.opacity=Math.max(0,dm.style.opacity-dt*1.5)}
function init(){
 gen();for(let i=0;i<NX*NZ;i++)build(i%NX,i/NX|0);
 let sx=W>>1;const sz=D>>1,top=(x,z)=>{let y=H-1;while(y>0&&!get(x,y,z))y--;return y};
 while(sx<W-4&&get(sx,top(sx,sz),sz)!=1)sx++;
 P[0]=sx+.5;P[1]=top(sx,sz)+1;P[2]=sz+.5;refresh();hud();
 msg.textContent='Click to play';ov.onclick=()=>cv.requestPointerLock();
 setInterval(pullFromServer,3000);
 requestAnimationFrame(loop)}
setTimeout(init,50);
</script></body></html>
