<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Survival — Minecraft-style Core</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,Segoe UI,sans-serif}
canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair:before{left:8px;top:2px;width:2px;height:14px}#crosshair:after{left:2px;top:8px;width:14px;height:2px}
#hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;background:#171717cc;border:2px solid #333;border-radius:5px}
.slot{width:58px;height:58px;border:2px solid #777;background:#2a2a2acc;position:relative;display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#fff;box-shadow:inset 0 0 0 2px #aaa}.slot .swatch{width:31px;height:31px;border:1px solid #111;image-rendering:pixelated}
.slot span{position:absolute;right:4px;bottom:2px;font-weight:800;font-size:15px}
.slot small{position:absolute;left:4px;top:2px;color:#ddd;font-size:11px}
#help{position:absolute;left:16px;top:16px;background:#1119;padding:10px 13px;border-radius:6px;line-height:1.45}
#status{position:absolute;right:16px;top:16px;background:#1119;padding:9px 12px;border-radius:6px;text-align:right}
#damage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border:3px solid #fff8;border-radius:4px;display:none}
#damagebar{position:absolute;left:50%;top:calc(50% + 29px);transform:translateX(-50%);width:120px;height:8px;background:#000a;border:1px solid #fff8;display:none}
#damagebar i{display:block;height:100%;width:0;background:#eee}
#overlay{position:fixed;inset:0;background:linear-gradient(#18345dcc,#102018dd);display:flex;align-items:center;justify-content:center;color:white;text-align:center;z-index:5}
.panel{max-width:560px;padding:32px;border:1px solid #ffffff33;background:#101812e8;border-radius:12px;box-shadow:0 20px 80px #0008}
h1{margin:0 0 8px;font-size:34px}.sub{opacity:.8;margin-bottom:20px}
button{pointer-events:auto;border:0;border-radius:6px;padding:12px 22px;font-size:16px;font-weight:700;background:#6fa64c;color:white;cursor:pointer}
kbd{background:#222;border:1px solid #555;border-radius:3px;padding:2px 5px}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:#111c;padding:9px 15px;border-radius:6px;opacity:0;transition:.2s}
</style>
</head>
<body>
<div id="overlay"><div class="panel">
<h1>Voxel Survival</h1><div class="sub">A Minecraft-inspired procedural survival sandbox.</div>
<p><kbd>WASD</kbd> move · <kbd>Shift</kbd> sprint · <kbd>Space</kbd> jump<br>
Hold <b>Left Click</b> to mine · <b>Right Click</b> to place<br>
<kbd>1–9</kbd> select hotbar · <kbd>Esc</kbd> release mouse</p>
<button id="start">Enter World</button>
</div></div>
<div class="ui">
<div id="help">WASD · Shift · Space<br>Hold LMB to mine · RMB to place</div>
<div id="status">Daylight<br><span id="coords">0, 0, 0</span></div>
<div id="crosshair"></div><div id="damage"></div><div id="damagebar"><i></i></div>
<div id="toast"></div><div id="hotbar"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/PointerLockControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd8ff);
scene.fog=new THREE.Fog(0x9bd8ff,55,150);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,220);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbde8ff,0x5a7046,1.45));
const sun=new THREE.DirectionalLight(0xfff1c7,2.2); sun.position.set(-45,80,30);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90; scene.add(sun);

const controls=new PointerLockControls(camera,document.body);
const player=new THREE.Object3D(); player.position.set(0,20,0); scene.add(player); player.add(camera);
camera.position.set(0,1.62,0);

const mat={
 grass:new THREE.MeshLambertMaterial({color:0x58a946}), dirt:new THREE.MeshLambertMaterial({color:0x8b5a36}),
 stone:new THREE.MeshLambertMaterial({color:0x777777}), wood:new THREE.MeshLambertMaterial({color:0x704626}),
 leaves:new THREE.MeshLambertMaterial({color:0x3d8e3c,transparent:true,opacity:.93}),
 sand:new THREE.MeshLambertMaterial({color:0xd8c17a}), water:new THREE.MeshLambertMaterial({color:0x3d9be8,transparent:true,opacity:.72})
};
const blocks={grass:{mat:mat.grass,hp:0.65,drop:'dirt'},dirt:{mat:mat.dirt,hp:.55,drop:'dirt'},stone:{mat:mat.stone,hp:1.8,drop:'stone'},wood:{mat:mat.wood,hp:1.15,drop:'wood'},leaves:{mat:mat.leaves,hp:.25,drop:'leaves'},sand:{mat:mat.sand,hp:.5,drop:'sand'}};
const world=new Map(), meshes=new Map();
const key=(x,y,z)=>`${x}|${y}|${z}`, parse=k=>k.split('|').map(Number);
const CHUNK=64, HEIGHT=34, WATER=8;

function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function noise(x,z){ // smooth multi-octave value noise
 let s=0,a=1,f=.045,n=0;
 for(let o=0;o<4;o++){let x0=Math.floor(x*f),z0=Math.floor(z*f),fx=x*f-x0,fz=z*f-z0;
  const u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a0=hash(x0,z0),a1=hash(x0+1,z0),b0=hash(x0,z0+1),b1=hash(x0+1,z0+1);
  s+=((a0+(a1-a0)*u)+((b0+(b1-b0)*u)-(a0+(a1-a0)*u))*v)*a;n+=a;f*=2.05;a*=.48;
 } return s/n;
}
function terrainHeight(x,z){
 const broad=noise(x,z), detail=noise(x+71,z-19);
 return Math.max(3,Math.floor(9+broad*13+detail*3));
}
function setBlock(x,y,z,t){ if(y<0||y>HEIGHT)return; world.set(key(x,y,z),t); }
function getBlock(x,y,z){return world.get(key(x,y,z))||null}

function generate(){
 const r=43;
 for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++){
  const h=terrainHeight(x,z), water=Math.max(0,WATER-h);
  for(let y=0;y<=h;y++) setBlock(x,y,z,y===h?'grass':y>h-4?'dirt':'stone');
  if(water) for(let y=h+1;y<=WATER;y++) setBlock(x,y,z,'water');
 }
 // trees, avoiding the spawn clearing and steep slopes
 for(let x=-r+3;x<=r-3;x++)for(let z=-r+3;z<=r-3;z++){
  if(Math.hypot(x,z)<8) continue;
  const h=terrainHeight(x,z);
  if(h<=WATER || Math.abs(terrainHeight(x+1,z)-h)>2 || Math.abs(terrainHeight(x,z+1)-h)>2) continue;
  if(hash(x*3,z*7)>.965){
   for(let y=1;y<=4;y++) setBlock(x,h+y,z,'wood');
   for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++){
    if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)<=4 && !getBlock(x+dx,h+dy,z+dz)) setBlock(x+dx,h+dy,z+dz,'leaves');
   }
  }
 }
}

const cubeGeo=new THREE.BoxGeometry(1,1,1);
function rebuild(){
 for(const m of meshes.values())scene.remove(m); meshes.clear();
 // Instancing per block type dramatically reduces draw overhead.
 const by={}; for(const [k,t] of world){if(!by[t])by[t]=[];by[t].push(k)}
 for(const [t,ks] of Object.entries(by)){
  if(t==='water') continue;
  const im=new THREE.InstancedMesh(cubeGeo,blocks[t]?.mat||mat.water,ks.length);
  im.castShadow=t!=='leaves'; im.receiveShadow=true; im.frustumCulled=false;
  const dummy=new THREE.Object3D();
  ks.forEach((k,i)=>{const [x,y,z]=parse(k);dummy.position.set(x+.5,y+.5,z+.5);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix)});
  im.instanceMatrix.needsUpdate=true; im.userData.keys=ks; im.userData.type=t; scene.add(im); meshes.set(t,im);
 }
 // simple water plane per column at its top level
 const wg=new THREE.BoxGeometry(1,.12,1);
 const wm=new THREE.Group();
 for(const [k,t] of world){if(t!=='water')continue;const [x,y,z]=parse(k);const q=new THREE.Mesh(wg,mat.water);q.position.set(x+.5,y+.94,z+.5);wm.add(q)}
 scene.add(wm); meshes.set('waterGroup',wm);
}
generate(); rebuild();

const inventory={dirt:0,stone:0,wood:0,leaves:0,sand:0};
const hot=['dirt','stone','wood','leaves','sand',null,null,null,null]; let selected=0;
const sw={dirt:0x8b5a36,stone:0x777777,wood:0x704626,leaves:0x3d8e3c,sand:0xd8c17a};
function drawHotbar(){const h=document.querySelector('#hotbar');h.innerHTML='';hot.forEach((t,i)=>{
 const s=document.createElement('div');s.className='slot '+(i===selected?'sel':'');s.innerHTML=`<small>${i+1}</small>`;
 if(t){const d=document.createElement('div');d.className='swatch';d.style.background='#'+sw[t].toString(16).padStart(6,'0');s.appendChild(d);s.innerHTML+=`<span>${inventory[t]||0}</span>`}
 h.appendChild(s)
})}
drawHotbar();

const keys={}; addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){let n=+e.code.slice(5)-1;if(n>=0&&n<9){selected=n;drawHotbar()}}});
addEventListener('keyup',e=>keys[e.code]=false);
let vy=0,onGround=false; const radius=.32,height=1.8,speed=5.2;
function solid(x,y,z){const t=getBlock(Math.floor(x),Math.floor(y),Math.floor(z));return t&&t!=='water'}
function collides(pos){
 const minX=Math.floor(pos.x-radius),maxX=Math.floor(pos.x+radius),minY=Math.floor(pos.y),maxY=Math.floor(pos.y+height),minZ=Math.floor(pos.z-radius),maxZ=Math.floor(pos.z+radius);
 for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++)for(let z=minZ;z<=maxZ;z++)if(solid(x,y,z)){
  if(pos.x+radius>x&&pos.x-radius<x+1&&pos.y+height>y&&pos.y<y+1&&pos.z+radius>z&&pos.z-radius<z+1)return true;
 }return false;
}
function move(dt){
 let dx=0,dz=0;if(keys.KeyW)dz-=1;if(keys.KeyS)dz+=1;if(keys.KeyA)dx-=1;if(keys.KeyD)dx+=1;
 const l=Math.hypot(dx,dz)||1, sprint=keys.ShiftLeft||keys.ShiftRight, sp=sprint?7.2:speed;
 const dir=new THREE.Vector3(dx/l,0,dz/l).applyQuaternion(camera.quaternion);dir.y=0;dir.normalize();
 const old=player.position.clone();
 let nx=player.position.clone();nx.x+=dir.x*sp*dt;if(!collides(nx))player.position.x=nx.x;
 nx=player.position.clone();nx.z+=dir.z*sp*dt;if(!collides(nx))player.position.z=nx.z;
 vy-=22*dt;if(keys.Space&&onGround){vy=8.5;onGround=false}
 let ny=player.position.clone();ny.y+=vy*dt;
 if(!collides(ny)){player.position.y=ny.y;onGround=false}
 else{
  if(vy<0){let tries=0;while(collides(player.position)&&tries++<8)player.position.y+=.03;onGround=true}
  else {while(collides(player.position))player.position.y-=.03}
  vy=0;
 }
 if(player.position.y<-10){player.position.set(0,25,0);vy=0}
 camera.position.set(0,0,0);
 document.querySelector('#coords').textContent=`${Math.floor(player.position.x)}, ${Math.floor(player.position.y)}, ${Math.floor(player.position.z)}`;
}

const ray=new THREE.Raycaster(); let target=null;
function pick(){
 ray.setFromCamera(new THREE.Vector2(0,0),camera); const hits=ray.intersectObjects([...meshes.values()].filter(x=>x.isMesh),true);
 for(const h of hits){if(h.distance>6)break;
  if(h.object.userData.keys){const idx=h.instanceId,k=h.object.userData.keys[idx]; if(k){const p=parse(k);return {key:k,pos:p,normal:h.face.normal.clone(),dist:h.distance}}}
 }return null;
}
let mining=null;
function mine(dt){
 target=pick(); const bar=document.querySelector('#damagebar'), fill=bar.querySelector('i');
 if(!keys.MouseLeft||!target){bar.style.display='none';mining=null;return}
 const t=getBlock(...target.pos); if(!t||!blocks[t])return;
 if(!mining||mining.key!==target.key)mining={key:target.key,progress:0,type:t};
 mining.progress+=dt/blocks[t].hp; bar.style.display='block';fill.style.width=Math.min(100,mining.progress*100)+'%';
 if(mining.progress>=1){const drop=blocks[t].drop;inventory[drop]=(inventory[drop]||0)+1;world.delete(target.key);rebuild();drawHotbar();toast('Collected '+drop);mining=null}
}
addEventListener('mousedown',e=>{if(e.button===0)keys.MouseLeft=true;if(e.button===2){e.preventDefault();place()}});
addEventListener('mouseup',e=>{if(e.button===0)keys.MouseLeft=false});addEventListener('contextmenu',e=>e.preventDefault());

function place(){
 if(!target)target=pick(); if(!target)return;
 const t=hot[selected];if(!t||!inventory[t])return;
 const [x,y,z]=target.pos,n=target.normal; const p=[x+Math.round(n.x),y+Math.round(n.y),z+Math.round(n.z)];
 if(p[1]<0||p[1]>HEIGHT||getBlock(...p))return;
 // Prevent placing a block overlapping the player's body.
 const old=player.position.clone();setBlock(...p,t); if(collides(player.position)){world.delete(key(...p));return}
 inventory[t]--;rebuild();drawHotbar();
}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,900)}

document.querySelector('#start').onclick=()=>{document.querySelector('#overlay').style.display='none';controls.lock()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(controls.isLocked)move(dt); mine(dt);
 // Gentle wind-like tree animation isn't necessary; keep voxel silhouette crisp.
 renderer.render(scene,camera)
}requestAnimationFrame(loop);
</script>
</body>
</html>
